# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "develop", "mendesb-br" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CMAKE_GENERATOR: "Visual Studio 17 2022"

jobs:
  build:
    name: Build and Test Production-Lens-Validation Tool on Windows
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: '==3.1.*'
        version: '6.10.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
    
    - name: Install OpenCV
      run: |
        $opencvVersion = "4.12.0"
        $opencvZip = "${{ github.workspace }}\opencv.zip"
        $opencvExtractDir = "${{ github.workspace }}\opencv"
        Write-Host "Downloading OpenCV $opencvVersion .zip package..."
        Invoke-WebRequest -Uri "https://github.com/opencv/opencv/archive/refs/tags/4.12.0.zip" -OutFile $opencvZip -Verbose -TimeoutSec 600
        Write-Host "Extracting OpenCV..."
        Expand-Archive -Path $opencvZip -DestinationPath $opencvExtractDir -Force
        Write-Host "Extraction complete"
        # Find the OpenCVConfig.cmake file
        Write-Host "Searching for OpenCVConfig.cmake..."
        $opencvConfigFile = Get-ChildItem -Path $opencvExtractDir -Recurse -Filter "OpenCVConfig.cmake" | Select-Object -First 1
        if ($opencvConfigFile -eq $null) {
            Write-Host "OpenCVConfig.cmake not found!"
            exit 1
        } else {
            Write-Host "Found OpenCVConfig.cmake at: $($opencvConfigFile.FullName)"
            $env:OpenCV_DIR = $opencvConfigFile.Directory.FullName
            Write-Host "Setting OpenCV_DIR environment variable to $env:OpenCV_DIR"
        }
      shell: pwsh

    - name: Configure CMake
      run: |
        cmake -S "${{ github.workspace }}\CameraViewerApp" -B "${{ github.workspace }}\build" -G "${{ env.CMAKE_GENERATOR }}" -A x64 `
          -DOpenCV_DIR="${{ github.workspace }}\opencv\build\x64\vc17\lib" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\Qt\6.10.0\msvc2022_64" `
          -DCAMERA_SDK_PATH="${{ github.workspace }}\CameraSDK"
      shell: pwsh

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}


name: Build Qt6 + OpenCV Project

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        cache: true

    - name: Install OpenCV and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libopencv-dev \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libgl1-mesa-dev

    # - name: Configure project
    #   working-directory: ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp
    #   run: |
    #     cmake -B build ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp -DCMAKE_BUILD_TYPE=Release

    # - name: Build project
    #   working-directory: ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp
    #   run: |
    #     cmake --build build --parallel

    - name: Run Batch File
      working-directory: ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp
      run: |
        git update-index --chmod=+x ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp/winBuild.bat
        ./winBuild.bat ./CameraSDK/OptiTrackCameraSDK_confidential_115_release-3.4.0_BUILD110/CameraSDK/samples/CameraViewerApp
